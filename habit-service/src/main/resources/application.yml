
server:
  port: 8081

spring:
  application:
    name: habit-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/habit_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: coinhabit
    password: ${RABBITMQ_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
