name: Backend MVP auth
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-postgres-only
      DB_PASSWORD: ci-postgres-only
      RABBITMQ_PASSWORD: ci-rabbit-only
      JWT_SECRET: ci-only-signing-secret-with-at-least-32-bytes
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start infrastructure including all three databases
        run: docker compose up -d --wait postgres rabbitmq && docker compose run --rm init-databases
      - name: Build and test auth
        run: bash auth-service/gradlew -p auth-service --no-daemon build
      - name: Build and test habits
        run: bash habit-service/gradlew -p habit-service --no-daemon build
      - name: Build and test savings
        run: bash savings-service/gradlew -p savings-service --no-daemon build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reports
          path: '**/build/reports/tests/'
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_PASSWORD: ci-postgres-only
      RABBITMQ_PASSWORD: ci-rabbit-only
      JWT_SECRET: ci-only-signing-secret-with-at-least-32-bytes
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1
    steps:
      - uses: actions/checkout@v4
      - name: Build and start full stack without SMTP
        run: docker compose up -d --build
      - name: Exercise cross-service guest ownership and conversion
        run: python3 scripts/smoke_auth.py
      - name: Diagnostic logs
        if: failure()
        run: docker compose logs --no-color --tail=200
