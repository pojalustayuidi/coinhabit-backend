
spring.application.name=auth-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:15432/coinhabit_auth
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=8640000

# SMTP
# По умолчанию используем локальный Mailpit.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

# Mailpit не требует авторизации и TLS.
# Для реального почтового провайдера настройки изменим.
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}

# Таймауты подключения
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# CoinHabit email verification
coinhabit.mail.from=${MAIL_FROM:noreply@coinhabit.local}
coinhabit.mail.verification-url=${VERIFICATION_URL:http://localhost:8080/api/auth/verify-email}
